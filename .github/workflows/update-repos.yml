name: Actualizar Proyectos Recientes

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "PROJECTS"
          feed_list: "https://github-feed-to-rss.vercel.app/FelipeAceved0"
          max_post_count: 5
