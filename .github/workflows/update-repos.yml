- name: Actualizar README con repositorios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import os
          import requests

          username = 'FelipeAceved0'
          url = f'https://api.github.com/users/{username}/repos?sort=updated&per_page=5'
          headers = {'Authorization': f'token {os.environ[\"GITHUB_TOKEN\"]}'} if 'GITHUB_TOKEN' in os.environ else {}

          response = requests.get(url, headers=headers)
          repos = response.json()

          repo_list = []
          for repo in repos:
              name = repo['name']
              html_url = repo['html_url']
              repo_list.append(f'* [{name}]({html_url})')

          content_to_insert = '\n'.join(repo_list)

          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()

          start_tag = '<!-- PROJECTS:START -->'
          end_tag = '<!-- PROJECTS:END -->'

          if start_tag in readme and end_tag in readme:
              start_idx = readme.find(start_tag) + len(start_tag)
              end_idx = readme.find(end_tag)
              new_readme = readme[:start_idx] + '\n' + content_to_insert + '\n' + readme[end_idx:]

              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)
          "
