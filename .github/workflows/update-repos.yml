name: Actualizar Proyectos Recientes

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: alexkhang/github-readme-recent-repos@v1
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          user: 'FelipeAceved0'
          limit: 5
          sort: 'updated'
